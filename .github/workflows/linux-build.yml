name: Linux build

# Builds the Linux plugins inside installer/linux/Dockerfile's fixed Ubuntu
# 22.04 image (glibc 2.35, and a cmake pulled from Kitware's own apt repo -
# see that Dockerfile's comment on why Ubuntu 22.04's own cmake package is
# too old) rather than on whatever the runner's own image happens to ship,
# so the emitted .so/.clap/.vst3 stay loadable on older distros and
# flatpak/snap sandboxes - see that Dockerfile's comment for the
# "GLIBC_2.43 not found in a flatpak host" issue this avoids. This also
# means CI builds exactly what installer/linux/docker-build.sh produces
# locally, so a release built here is reproducible on a dev machine too.
#
# On a `v*` tag push, this also publishes the tarball as a GitHub Release
# directly - no local Docker run, packaging, or `gh release create` by
# hand needed for a Linux release anymore. That manual path is exactly
# what shipped v0.1.0 built natively (against a rolling-release glibc
# that's newer than what e.g. Bitwig's flatpak sandbox ships), which is
# what caused it to fail to load there in the first place - having every
# tagged release go through this one automated, always-portable path
# instead removes that whole class of mistake.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed for the release-publish step below to run `gh release create`

jobs:
  # Runs the core/ DSP unit tests on a plain native toolchain, separate from
  # the Docker release build below: it's seconds instead of minutes, and it
  # doesn't need the glibc baseline the shipped binaries do. Kept in this
  # workflow (rather than a fourth one) so a red test shows up on the same
  # PR check as the Linux build itself.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake, Ninja, and a C++ compiler
        # Same prerequisite list README's "Install prerequisites" gives for a
        # native build - the test target itself doesn't need X11/OpenGL, but
        # configuring the plugin targets that share this CMakeLists does.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            libx11-dev libxext-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build and run the DSP unit tests
        run: |
          cmake --build build-tests --target ampforge_tests
          ctest --test-dir build-tests --output-on-failure

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugins (Docker, glibc 2.35 baseline)
        run: installer/linux/docker-build.sh

      - name: Determine release version from the git tag
        id: version
        # Only set on an actual `v*` tag push - the package script's own
        # hardcoded fallback (installer/linux/package.sh) covers every
        # other trigger (plain push, PR, workflow_dispatch), where there's
        # no tag to derive a version from.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Package release tarball
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: BUILD_DIR=build-docker installer/linux/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ampforge-linux-x86_64
          path: build-docker/AmpForge-*-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build-docker/AmpForge-*-linux-x86_64.tar.gz \
            --title "AmpForge $GITHUB_REF_NAME" \
            --generate-notes
